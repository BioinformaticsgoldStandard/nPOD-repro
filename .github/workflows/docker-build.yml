name: Build and publish Docker image

on:
  push:
    branches:
      - repro
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/bioinformaticsgoldstandard/npod-repro

jobs:
  build-verify-push:
    runs-on: ubuntu-latest

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup \
            /usr/lib/jvm
          sudo apt-get autoremove -y
          sudo apt-get autoclean
          df -h

      - uses: actions/checkout@v4

      - name: Set short SHA
        id: meta
        run: |
          SHORT=$(git rev-parse --short HEAD)
          echo "sha=$SHORT" >> "$GITHUB_OUTPUT"
          echo "SHA=$SHORT" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: "Check 0: real entrypoint — JupyterLab starts and responds on :8888"
        run: |
          CID=$(docker run -d -p 8888:8888 "$IMAGE":latest)
          trap "docker stop $CID; docker rm $CID" EXIT
          echo "Waiting for JupyterLab on port 8888…"
          # docker-proxy accepts the connection before Jupyter listens and
          # returns an empty reply (curl exit 52), which --retry alone does
          # not retry; --retry-all-errors covers it.
          VERSION=$(curl --silent --fail \
            --retry 30 --retry-delay 1 --retry-connrefused --retry-all-errors \
            http://localhost:8888/api)
          echo "JupyterLab API: $VERSION"
          echo "Check 0 OK"

      - name: "Check 1: container starts"
        run: docker run --rm --entrypoint echo "$IMAGE":latest "container starts OK"

      # Run from both Jupyter installations (py3: standalone, jhub: under
      # JupyterHub). Checking names alone is not enough: jhub ships its own
      # python3 kernelspec, which would shadow py3's under the same name.
      - name: "Check 2: Jupyter kernels registered (python3 + r4) in py3 and jhub"
        run: |
          for env in py3 jhub; do
            output=$(docker run --rm \
              --entrypoint /opt/conda/envs/$env/bin/jupyter \
              "$IMAGE":latest kernelspec list --json)
            echo "$env: $output"
            echo "$output" | python3 -c '
          import json, sys
          specs = json.load(sys.stdin)["kernelspecs"]
          assert specs["python3"]["spec"]["argv"][0] == "/opt/conda/envs/py3/bin/python", "python3 is not the py3 env"
          assert specs["r4"]["spec"]["argv"][0] == "/opt/conda/envs/r/lib/R/bin/R", "r4 is not the r env"
          ' || { echo "FAIL: wrong or missing kernel in $env"; exit 1; }
          done
          echo "Both kernels present and correct in py3 and jhub"

      - name: "Check 3: R stack — Seurat, Signac, Matrix 1.5.4"
        run: |
          docker run --rm \
            --entrypoint /opt/conda/envs/r/bin/Rscript \
            "$IMAGE":latest \
            -e "library(Seurat); library(Signac); stopifnot(packageVersion('Matrix') == '1.5.4'); cat('R stack OK\n')"

      - name: "Check 4: Python stack — scanpy, pysam"
        run: |
          docker run --rm \
            --entrypoint /opt/conda/envs/py3/bin/python \
            "$IMAGE":latest \
            -c "import scanpy, pysam; print('Python stack OK')"

      - name: "Check 5: shell activation — bash -lic resolves python to py3"
        run: |
          CID=$(docker run -d --entrypoint sleep "$IMAGE":latest infinity)
          trap "docker stop $CID; docker rm $CID" EXIT
          PYTHON_PATH=$(docker exec "$CID" bash -lic 'command -v python' 2>&1)
          echo "command -v python → $PYTHON_PATH"
          echo "$PYTHON_PATH" | grep -q '/opt/conda/envs/py3/bin/python' \
            || { echo "FAIL: expected /opt/conda/envs/py3/bin/python"; exit 1; }
          echo "Shell activation OK"

      - name: Push to GHCR
        run: |
          docker push "$IMAGE":latest
          docker push "$IMAGE":"$SHA"
